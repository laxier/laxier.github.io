name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Point download button at the newest resume
        run: |
          latest=$(for f in docs/cv/*.pdf; do
            echo "$(echo "$f" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | tail -1) $(git log -1 --format=%ct -- "$f") $f"
          done | sort | tail -1 | cut -d' ' -f3-)
          echo "Newest resume: $latest"
          sed -i "s|href=\"docs/cv/[^\"]*\.pdf\"|href=\"${latest}\"|" index.html

      - name: Stamp deployment date
        run: |
          deploy_date=$(date -u '+%d.%m.%Y')
          sed -i "s/data-deploy-date>[^<]*/data-deploy-date>${deploy_date}/" index.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
